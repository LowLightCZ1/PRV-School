<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link for google Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!---->
    <link rel="stylesheet" href="../css/style.css">
    <title>Zakaznická Podpora</title>
</head>
<body>
    <container class="main-cont">
        <h1>Technická podpora - LowLight Games</h1>

        <p>Jak ti mohu pomoct? Napiš, jaký máš problém</p>

        <section class="form-sec">
            <form action="" class="dotaz" id="question_form">
                <label for="dotaz">Tvůj dotaz:</label><br>
                <textarea name="question" id="question" placeholder="Např: Nefunguje mi přihlášení..."></textarea>

                <label for="email">Email (nepoviné):</label><br>
                <input type="email" name="text-email" id="email">

                <button>Odeslat dotaz</button>
            </form>
        </section>  

        <section id="answer">
            <h2>Odpověd podpory</h2>
            <div id="answer">
                Zatím žádný dotaz
            </div>
        </section>
    </container>





    <script src="../JavaScript/script.js"></script>
</body>
</html>
